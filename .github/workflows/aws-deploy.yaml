name: AWS CI - Build and Push Microservices
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
permissions:
  contents: read
  packages: write
 
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push microservices
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
 
          build_push() {
            SERVICE=$1
            CONTEXT=$2
 
            echo "Building $SERVICE..."
 
            docker buildx build \
              --platform linux/amd64 \
              --file "$CONTEXT/Dockerfile" \
              --tag "$REGISTRY/$OWNER/microservices-demo-$SERVICE:$IMAGE_TAG" \
              --push \
              "$CONTEXT"
          }
 
          build_push emailservice src/emailservice
          build_push productcatalogservice src/productcatalogservice
          build_push recommendationservice src/recommendationservice
          build_push shoppingassistantservice src/shoppingassistantservice
          build_push shippingservice src/shippingservice
          build_push checkoutservice src/checkoutservice
          build_push paymentservice src/paymentservice
          build_push currencyservice src/currencyservice
          build_push cartservice src/cartservice/src
          build_push frontend src/frontend
          build_push adservice src/adservice
 
      - name: Display published images
        run: |
          echo "Images published with tag:"
          echo "${GITHUB_SHA}"
