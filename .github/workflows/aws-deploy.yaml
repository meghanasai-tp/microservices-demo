name: AWS CI/CD - Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: adservice, context: src/adservice }
          - { service: cartservice, context: src/cartservice/src }
          - { service: checkoutservice, context: src/checkoutservice }
          - { service: currencyservice, context: src/currencyservice }
          - { service: emailservice, context: src/emailservice }
          - { service: frontend, context: src/frontend }
          - { service: paymentservice, context: src/paymentservice }
          - { service: productcatalogservice, context: src/productcatalogservice }
          - { service: recommendationservice, context: src/recommendationservice }
          - { service: shippingservice, context: src/shippingservice }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to k3s on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            for svc in adservice cartservice checkoutservice currencyservice emailservice frontend paymentservice productcatalogservice recommendationservice shippingservice; do
              kubectl set image deployment/$svc "*=${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-$svc:${{ github.sha }}"
            done
            for svc in adservice cartservice checkoutservice currencyservice emailservice frontend paymentservice productcatalogservice recommendationservice shippingservice; do
              kubectl rollout status deployment/$svc --timeout=300s
            done
            kubectl get pods
